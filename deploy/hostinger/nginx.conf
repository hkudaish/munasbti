# /etc/nginx/sites-available/munasbti  (Hostinger VPS, Ubuntu).  Replace munasbti.biz, then:
#   sudo ln -s /etc/nginx/sites-available/munasbti /etc/nginx/sites-enabled/ && sudo certbot --nginx -d munasbti.biz -d www.munasbti.biz && sudo nginx -t && sudo systemctl reload nginx
#
# Client address: $proxy_add_x_forwarded_for APPENDS the real peer address, and the app reads the entry added by the last trusted proxy
# (TRUSTED_PROXY_HOPS=1 in .env.production). If Cloudflare sits in front of nginx, use TRUSTED_PROXY_HOPS=2.

# Coarse flood guard in front of the app (the app has its own per-account limits): 20 requests/second per address, bursts of 40.
limit_req_zone $binary_remote_addr zone=site:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

upstream munasbti { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 80;
  server_name munasbti.biz www.munasbti.biz;
  return 301 https://munasbti.biz$request_uri;
}

server {
  listen 443 ssl http2;
  server_name munasbti.biz;
  # certbot fills these in:
  # ssl_certificate     /etc/letsencrypt/live/munasbti.biz/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/munasbti.biz/privkey.pem;

  client_max_body_size 2m;           # the app caps JSON bodies at about 1.6 MB
  server_tokens off;
  gzip on; gzip_comp_level 5; gzip_min_length 512; gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s; proxy_read_timeout 60s; proxy_send_timeout 30s;

  # Hashed build assets never change: let browsers and any CDN keep them for a year.
  location /_next/static/ { proxy_pass http://munasbti; proxy_cache_valid 200 365d; add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Sign-in, sign-up and reset forms: tighter flood guard.
  location /api/auth/ { limit_req zone=auth burst=10 nodelay; limit_req_status 429; proxy_pass http://munasbti; }

  # Never expose the internal job endpoints to the internet; cron calls them on 127.0.0.1 directly.
  location /api/internal/ { allow 127.0.0.1; deny all; proxy_pass http://munasbti; }

  location / { limit_req zone=site burst=40 nodelay; limit_req_status 429; proxy_pass http://munasbti; }
}
